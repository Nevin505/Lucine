services:
  db:
    image: postgres:16-alpine
    container_name: leucine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leucine
      POSTGRES_PASSWORD: leucine
      POSTGRES_DB: leucine
    volumes:
      - leucine_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leucine -d leucine"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: leucine-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://leucine:leucine@db:5432/leucine?schema=public
      JWT_SECRET: change-me-to-a-long-random-string
      PORT: 3001
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    container_name: leucine-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  leucine_pgdata:
