services:
  db:
    image: postgres:16-alpine
    container_name: leucine-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: leucine
      POSTGRES_PASSWORD: leucine
      POSTGRES_DB: leucine
    volumes:
      - leucine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leucine -d leucine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  leucine_pgdata:
